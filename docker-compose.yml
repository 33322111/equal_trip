services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equaltrip_db}
      POSTGRES_USER: ${POSTGRES_USER:-trip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trip_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trip_user} -d ${POSTGRES_DB:-equaltrip_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: "development"
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_DB_NAME: ${POSTGRES_DB:-equaltrip_db}
      DJANGO_DB_USER: ${POSTGRES_USER:-trip_user}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-trip_password}
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      OPENEXCHANGERATES_API_KEY: ${OPENEXCHANGERATES_API_KEY:-}
      YANDEX_SMTP_USER: ${YANDEX_SMTP_USER:-}
      YANDEX_SMTP_FROM: ${YANDEX_SMTP_FROM:-}
      YANDEX_SMTP_PASSWORD: ${YANDEX_SMTP_PASSWORD:-}
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_YMAPS_API_KEY: ${VITE_YMAPS_API_KEY:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  backend_media:
  frontend_node_modules:
