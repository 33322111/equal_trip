name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy main to production
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_URL: ${{ secrets.DEPLOY_REPO_URL }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
          PROD_ENV_B64: ${{ secrets.PRODUCTION_ENV_B64 }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          envs: REPO_URL,APP_DIR,PROD_ENV_B64
          script_stop: true
          script: |
            set -euo pipefail

            if [ ! -d "${APP_DIR}/.git" ]; then
              mkdir -p "${APP_DIR}"
              git clone "${REPO_URL}" "${APP_DIR}"
            fi

            cd "${APP_DIR}"
            git fetch origin
            git checkout main
            git pull --ff-only origin main

            echo "${PROD_ENV_B64}" | base64 -d > .env
            docker compose --env-file .env -p equaltrip-prod up -d --build
            docker image prune -f
