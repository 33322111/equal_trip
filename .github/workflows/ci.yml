name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: equaltrip_db
          POSTGRES_USER: trip_user
          POSTGRES_PASSWORD: trip_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trip_user -d equaltrip_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_DB_NAME: equaltrip_db
      DJANGO_DB_USER: trip_user
      DJANGO_DB_PASSWORD: trip_password
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "5432"
      FRONTEND_URL: http://localhost:5173
      OPENEXCHANGERATES_API_KEY: ""
      YANDEX_SMTP_USER: ""
      YANDEX_SMTP_FROM: ""
      YANDEX_SMTP_PASSWORD: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: python -m coverage run --rcfile=.coveragerc manage.py test

      - name: Coverage report
        run: python -m coverage report -m
